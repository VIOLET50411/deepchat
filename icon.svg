<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e0e0e0"/>
        </linearGradient>
        <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="35%" stop-color="#ffffff" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
        </linearGradient>
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
        </filter>
    </defs>
    <!-- Base App Icon rounded rect -->
    <rect width="100" height="100" rx="22" fill="url(#glassBg)"/>
    
    <!-- Glossy overlay for liquid glass effect -->
    <rect width="100" height="100" rx="22" fill="url(#glassGloss)"/>
    
    <!-- Inner subtle border for 3D edge -->
    <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.05"/>

    <!-- Black Phi (Φ) symbol with subtle shadow -->
    <g transform="translate(50 50)" filter="url(#dropShadow)">
        <rect x="-4" y="-28" width="8" height="56" rx="4" fill="#1c1c1e"/>
        <circle cx="0" cy="0" r="16" fill="none" stroke="#1c1c1e" stroke-width="8" />
    </g>
</svg>
